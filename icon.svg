<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#2dd4bf" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="4" filter="url(#shadow)" />

  <!-- Circular Pressure Gauge Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#2dd4bf" stroke-width="8" stroke-dasharray="820 400" stroke-linecap="round" opacity="0.45" transform="rotate(135 256 256)" />

  <!-- Heart Shape -->
  <g filter="url(#shadow)">
    <path d="M 256,390 C 256,390 120,305 120,205 C 120,150 160,115 210,115 C 238,115 250,132 256,145 C 262,132 274,115 302,115 C 352,115 392,150 392,205 C 392,305 256,390 256,390 Z" 
          fill="url(#heartGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="4" />
  </g>

  <!-- ECG Cardiogram Pulse Wave -->
  <path d="M 115,250 L 185,250 L 205,230 L 220,270 L 245,170 L 273,315 L 300,235 L 320,250 L 395,250" 
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />

  <!-- Glowing Pulse Apex Point -->
  <circle cx="245" cy="170" r="14" fill="#2dd4bf" filter="url(#pulseGlow)" />
  <circle cx="245" cy="170" r="7" fill="#ffffff" />
</svg>
